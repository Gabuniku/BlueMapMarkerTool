name: Waterway Graph Checks

on:
  push:
    branches:
      - feature/waterway-graph

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/main/resources/assets/bluemap_marker_tool/area-draw.js
          node --check src/main/resources/assets/bluemap_marker_tool/fairway-geometry.js
          node --check src/main/resources/assets/bluemap_marker_tool/fairway-network.js
      - name: Geometry and network model tests
        run: |
          node tests/fairway-geometry.test.cjs
          node tests/fairway-network.test.cjs
          node tests/editor-smoke.cjs
      - name: Build
        run: ./gradlew build --no-daemon
