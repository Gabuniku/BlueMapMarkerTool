name: Check Fairway Editor

on:
  push:
    branches:
      - feature/fairway-editor
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/main/resources/assets/bluemap_marker_tool/area-draw.js
          node --check src/main/resources/assets/bluemap_marker_tool/text-markers.js
          node --check src/main/resources/assets/bluemap_marker_tool/fairway-geometry.js
      - name: Check corridor polygon geometry
        run: node src/test/js/fairway.test.cjs
      - name: Build mod
        run: ./gradlew build --no-daemon
